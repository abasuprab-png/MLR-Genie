[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlr-genie"
version = "3.4.0"
description = "MLR Genie — Execution Agent for Pharma, Biotech & MedTech Communications on GCP with Google ADK and Gemini Models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.30.1",
    "pydantic>=2.7.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.20",
    "psycopg[binary]>=3.2.0",
    "google-cloud-storage>=3.0.0",
    "google-auth>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
pythonpath = ["."]
