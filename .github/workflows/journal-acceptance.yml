name: Verify public journal on existing US deployment
run-name: Journal acceptance · ${{ github.sha }}
on:
  push:
    branches: [deploy/production]
    paths:
      - '.github/workflows/journal-acceptance.yml'
      - 'deploy/automation/journal_acceptance.py'
      - 'evals/live_journal_verification.py'
      - 'tests/test_live_journal_verification.py'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: mlr-genie-gcp-production
  cancel-in-progress: false
jobs:
  journal:
    if: >-
      github.repository_id == '1439565611' &&
      github.repository_owner_id == '227769156' &&
      github.ref == 'refs/heads/deploy/production' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies and test the journal evaluator
        env:
          GEMINI_API_KEY: ''
        run: |
          python -m pip install '.[dev]'
          python -m pytest tests/test_live_journal_verification.py -q
      - name: Authenticate to Google Cloud using GitHub OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: commsrx-ai
          workload_identity_provider: projects/333570013714/locations/global/workloadIdentityPools/mlr-genie-github/providers/github
          service_account: mlr-genie-deployer@commsrx-ai.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Set up Google Cloud SDK 591.0.0
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: '591.0.0'
          project_id: commsrx-ai

      - name: Verify journal against the existing US deployment
        run: python deploy/automation/journal_acceptance.py
      - name: Upload public fixture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: journal-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            deployment-output/report.json
            deployment-output/journal/result.json
            deployment-output/journal/diagnostic.json
          if-no-files-found: ignore
          retention-days: 14
