name: Deploy MLR Genie to Google Cloud
run-name: Production deployment · ${{ github.sha }}

# Only this designated release branch can request production credentials.
on:
  push:
    branches:
      - deploy/production
    paths-ignore:
      - '.github/workflows/deploy-gcp.yml'
      - '.github/workflows/journal-acceptance.yml'
      - 'deploy/automation/journal_acceptance.py'
      - 'evals/live_journal_verification.py'
      - 'tests/test_live_journal_verification.py'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  # Publish only the non-secret public IP so DNS can be set while TLS is pending.
  statuses: write

concurrency:
  group: mlr-genie-gcp-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Test, deploy, and verify production
    if: >-
      github.repository_id == '1439565611' &&
      github.repository_owner_id == '227769156' &&
      github.ref == 'refs/heads/deploy/production' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mlr_genie
          POSTGRES_USER: mlr_genie_test
          POSTGRES_PASSWORD: ephemeral-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mlr_genie_test -d mlr_genie"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Terraform 1.14.0
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.14.0'
          terraform_wrapper: false

      - name: Install test dependencies
        run: |
          python -m pip install '.[dev]'
          npm ci

      - name: Verify bootstrap without runtime-role membership
        env:
          MLR_GENIE_TEST_BOOTSTRAP_POSTGRES_URL: postgresql://mlr_genie_test:ephemeral-ci-test-only@127.0.0.1:5432/mlr_genie
        run: python -m pytest tests/test_postgres_bootstrap.py -q

      - name: Bootstrap the isolated PostgreSQL test schema
        env:
          MLR_GENIE_TEST_POSTGRES_URL: postgresql://mlr_genie_test:ephemeral-ci-test-only@127.0.0.1:5432/mlr_genie
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ['MLR_GENIE_TEST_POSTGRES_URL']) as connection:
              connection.execute('CREATE SCHEMA IF NOT EXISTS mlr_genie')
          PY

      - name: Run all Python tests, including PostgreSQL and journal checks
        env:
          GEMINI_API_KEY: ''
          GOOGLE_API_KEY: ''
          GOOGLE_GENAI_USE_VERTEXAI: 'false'
          GOOGLE_GENAI_LIVE_VERTEX: 'false'
          MLR_REQUIRE_LIVE_GEMINI: 'false'
          MLR_GENIE_TEST_POSTGRES_URL: postgresql://mlr_genie_test:ephemeral-ci-test-only@127.0.0.1:5432/mlr_genie
          MLR_TEST_POSTGRES_DSN: postgresql://mlr_genie_test:ephemeral-ci-test-only@127.0.0.1:5432/mlr_genie
        run: python -m pytest tests/ evals/ -q

      - name: Check, test, and build the client
        run: |
          npm run check
          npm run client:check
          npm test
          npm run client:build

      - name: Validate Terraform before cloud authentication
        run: |
          terraform -chdir=deploy/terraform fmt -check -recursive
          terraform -chdir=deploy/terraform init -backend=false -input=false -lockfile=readonly
          terraform -chdir=deploy/terraform validate -no-color

      - name: Authenticate to Google Cloud using GitHub OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: commsrx-ai
          workload_identity_provider: projects/333570013714/locations/global/workloadIdentityPools/mlr-genie-github/providers/github
          service_account: mlr-genie-deployer@commsrx-ai.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Set up Google Cloud SDK 591.0.0
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: '591.0.0'
          project_id: commsrx-ai

      - name: Enable project inspection API
        # Use the authorized immutable project number: resolving an ID can itself
        # require the API that this first-run step is enabling.
        run: gcloud services enable cloudresourcemanager.googleapis.com --project=333570013714 --quiet

      - name: Deploy and verify production
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python deploy/automation/deploy_gcp.py --config deploy/automation/target.json

      # Explicit allowlist: never upload ADC, Terraform plans/state, or raw logs.
      - name: Upload sanitized deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            deployment-output/report.json
            deployment-output/plan-summary.json
            deployment-output/vertex-probe.json
            deployment-output/journal-intake-probe.json
            deployment-output/integrations.json
            deployment-output/journal/result.json
            deployment-output/persistence.json
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: false
